name: Linux AppImage

# Builds VLC as an x86_64 AppImage.
# - on every push to a branch and on manual runs: the AppImage is attached
#   to the workflow run as an artifact
# - releases: a GitHub release is published with the AppImage and its
#   checksum, either
#     - when a version tag (v1.2.3, v1.2.3-rc.1) is pushed, or
#     - when a push brings a version in extras/package/appimage/VERSION that
#       has no tag yet: the v<version> tag is then created on the pushed commit
#   versions with a suffix (1.2.3-rc.1) are published as pre-releases

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      WORK_DIR: ${{ github.workspace }}/build-appimage
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ccache \
            $(grep -v '^\s*#' extras/package/appimage/ubuntu-deps.txt | grep -v '^\s*$')

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-appimage-${{ github.sha }}
          restore-keys: ccache-appimage-

      - name: Version
        id: version
        run: |
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            release=true
          else
            version="v$(tr -d '[:space:]' < extras/package/appimage/VERSION)"
            if [[ "$GITHUB_EVENT_NAME" == push ]] && ! git rev-parse -q --verify "refs/tags/${version}" > /dev/null; then
              # a new version: tag the pushed commit and release it
              release=true
            else
              version="$(git describe --tags --always)"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "Building ${version} (release: ${release})"

      - name: Build the AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          extras/package/appimage/build-appimage.sh
          ccache --show-stats || true

      - name: Test on a clean system
        run: |
          # decode a generated clip and start the Qt interface with the
          # packaged VLC, in a container without its build dependencies
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=320x240:rate=25 \
            -f lavfi -i sine -t 2 -c:v libx264 -c:a aac -shortest "$RUNNER_TEMP/clip.mp4"
          appimage=$(basename "$(ls "$WORK_DIR"/VLC-*-x86_64.AppImage)")
          docker run --rm \
            -v "$WORK_DIR:/appimage:ro" \
            -v "$RUNNER_TEMP:/media:ro" \
            -v "$PWD/extras/package/appimage:/scripts:ro" \
            debian:trixie \
            bash /scripts/test-appimage.sh "/appimage/$appimage" /media/clip.mp4

      - name: Checksum
        run: |
          cd "$WORK_DIR"
          sha256sum VLC-*-x86_64.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: VLC-${{ steps.version.outputs.version }}-x86_64-AppImage
          path: |
            ${{ env.WORK_DIR }}/VLC-*-x86_64.AppImage
            ${{ env.WORK_DIR }}/SHA256SUMS
          if-no-files-found: error

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          # creates the tag on the built commit when it does not exist yet
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VLC ${TAG}" \
            --generate-notes \
            "${prerelease[@]}" \
            "$WORK_DIR"/VLC-*-x86_64.AppImage "$WORK_DIR"/SHA256SUMS
